name: superKV CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
          pip install tilelang pytest -q 2>/dev/null || echo "tilelang not available on CPU runner"

      - name: Test (core algorithms)
        run: |
          pytest tests/test_core.py tests/test_turboquant.py tests/test_vllm_plugin.py -v --tb=short
