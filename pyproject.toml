[project]
name = "superkv"
version = "0.1.0"
description = "Multi-algorithm KV cache compression toolkit with tilelang cross-platform backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "tilelang>=0.1.12",
]

[project.optional-dependencies]
vllm = ["vllm>=0.7"]
all = ["vllm>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
